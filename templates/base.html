<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}AI Resume Screening{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #f5f7fb;
            font-family: Arial, sans-serif;
            color: #1e293b;
            min-height: 100vh;
        }

        /* Navbar */
        .main-navbar {
            background: #ffffff;
            padding: 14px 0;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .brand {
            color: #4f46e5 !important;
            font-size: 21px;
            font-weight: 700;
            text-decoration: none;
        }

        .nav-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            border: 1px solid #e2e8f0;
            color: #475569;
            background: white;
            border-radius: 7px;
            padding: 8px 14px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.2s;
        }

        .nav-btn:hover {
            background: #eef2ff;
            color: #4f46e5;
            border-color: #c7d2fe;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.2s;
        }

        .logout-btn:hover {
            background: #dc2626;
            color: white;
        }

        /* Main content */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 35px 20px;
        }

        /* Mobile navigation */
        @media (max-width: 768px) {

            .brand {
                font-size: 18px;
            }

            .nav-buttons {
                margin-top: 15px;
                flex-wrap: wrap;
            }

            .nav-btn,
            .logout-btn {
                font-size: 13px;
                padding: 7px 11px;
            }
        }

        @media (max-width: 576px) {

            .main-navbar .container {
                flex-direction: column;
                align-items: flex-start !important;
            }

            .nav-buttons {
                width: 100%;
            }

            .nav-btn,
            .logout-btn {
                flex: 1;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<!-- Navigation Bar -->
<nav class="main-navbar">

    <div class="container d-flex justify-content-between align-items-center">

        <!-- Logo -->
        <a class="brand" href="{% url 'dashboard' %}">
            🤖 AI Resume Screening
        </a>


        <!-- Navigation Links -->
        <div class="nav-buttons">

            <a class="nav-btn" href="{% url 'dashboard' %}">
                🏠 Dashboard
            </a>

            <a class="nav-btn" href="{% url 'upload_resume' %}">
                📄 Upload
            </a>

            <a class="nav-btn" href="{% url 'create_job' %}">
                💼 Jobs
            </a>

            <a class="nav-btn" href="{% url 'recruiter_dashboard' %}">
                📊 Recruiter
            </a>

            <a class="logout-btn" href="{% url 'logout' %}">
                Logout
            </a>

        </div>

    </div>

</nav>


<!-- Page Content -->
<main class="main-content">

    {% block content %}

    {% endblock %}

</main>


</body>
</html>
